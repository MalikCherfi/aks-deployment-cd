name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
    CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}

jobs:
    deploy:
        permissions:
            actions: read
            contents: read
            id-token: write
        runs-on: arc-runner-set
        steps:
            - uses: actions/checkout@v7
            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # Get the public IP address of the GitHub Actions runner and whitelist it on AKS
            # - name: Add GitHub Runner IP to existing AKS ranges
            #   run: |
            #       RUNNER_IP=$(curl -4 -s ifconfig.me)

            #       EXISTING_RANGES=$(az aks show \
            #           --resource-group ${{ env.RESOURCE_GROUP }} \
            #           --name ${{ env.CLUSTER_NAME }} \
            #           --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv | paste -sd, -)

            #       if [ -z "$EXISTING_RANGES" ]; then
            #           TARGET_RANGES="${RUNNER_IP}/32"
            #       else
            #           TARGET_RANGES="${EXISTING_RANGES},${RUNNER_IP}/32"
            #       fi

            #       echo "IPs autorisées : ${TARGET_RANGES}"

            #       az aks update \
            #           --resource-group ${{ env.RESOURCE_GROUP }} \
            #           --name ${{ env.CLUSTER_NAME }} \
            #           --api-server-authorized-ip-ranges "${TARGET_RANGES}"

            # Use kubelogin to configure your kubeconfig for Azure auth
            - name: Set up kubelogin for non-interactive login
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: "v0.2.19"

            # Retrieves your Azure Kubernetes Service cluster's kubeconfig file
            - name: Get K8s context
              uses: azure/aks-set-context@v3
              with:
                  resource-group: ${{ env.RESOURCE_GROUP }}
                  cluster-name: ${{ env.CLUSTER_NAME }}
                  admin: "false"
                  use-kubelogin: "true"

            # Retrieve ACR name
            - name: Retrieve ACR name from ACR tags
              id: get-acr
              run: |
                  ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
                  --query "[?tags.owner=='malik-cherfi'].name" -o tsv)
                  echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

            - name: Log in to Azure Container Registry
              run: |
                  az acr login --name ${{ steps.get-acr.outputs.acr_name }}

            # Bake Helm Chart vers un manifest bundle unique
            - name: Bake Manifests with Helm
              uses: azure/k8s-bake@v2
              id: bake
              with:
                  renderEngine: "helm"
                  helmChart: "./helm"
                  helm-version: "latest"
                  overrides: |
                      acrName:${{ steps.get-acr.outputs.acr_name }}
                      imageTag:${{ vars.LAST_BUILD_SHA }}

            # Deploys application based on manifest files from previous step
            - name: Deploy application
              uses: Azure/k8s-deploy@v4
              with:
                  action: deploy
                  namespace: "demo-app"
                  manifests: ${{ steps.bake.outputs.manifestsBundle }}
                  images: |
                      ${{ steps.get-acr.outputs.acr_name }}.azurecr.io/api:${{ vars.LAST_BUILD_SHA }}

            # - name: Remove GitHub Runner IP from AKS
            #   if: always()
            #   run: |
            #       RUNNER_IP=$(curl -4 -s ifconfig.me)

            #       CURRENT_RANGES=$(az aks show \
            #           -g ${{ env.RESOURCE_GROUP }} \
            #           -n ${{ env.CLUSTER_NAME }} \
            #           --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv)

            #       CLEANED_RANGES=$(echo "$CURRENT_RANGES" | grep -v "^${RUNNER_IP}/32$" | paste -sd, -)

            #       echo "IPs conservées : ${CLEANED_RANGES}"

            #       az aks update \
            #           -g ${{ env.RESOURCE_GROUP }} \
            #           -n ${{ env.CLUSTER_NAME }} \
            #           --api-server-authorized-ip-ranges "$CLEANED_RANGES"
