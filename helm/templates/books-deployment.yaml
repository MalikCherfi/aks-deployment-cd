apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-app
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: books-app
    app.kubernetes.io/instance: books-app
    app.kubernetes.io/version: "1.14.2"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: books-app
      app.kubernetes.io/instance: books-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: books-app
        app.kubernetes.io/instance: books-app
        app.kubernetes.io/version: "1.14.2"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: demo-app
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: books-app
          image: "{{ .Values.acrName }}.azurecr.io/books:{{ .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/app/books"]
          env:
            - name: PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"